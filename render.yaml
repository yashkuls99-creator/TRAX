databases:
  - name: ngo-expense-db
    databaseName: ngo_expense
    plan: free

services:
  - type: web
    name: ngo-expense-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run prisma:deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ngo-expense-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: ngo-expense-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
